# Self-host Stream with HTTPS in one command:
#
#   STREAM_DOMAIN=stream.example.com docker compose up -d
#
# Point the domain's DNS at this machine first; Caddy fetches the certificate.
# No Redis needed for a single instance. For several instances behind a load
# balancer, add a redis service and set REDIS_URL + SESSION_SECRET on each.
services:
  stream:
    build: .
    restart: unless-stopped
    environment:
      CORS_ORIGINS: https://${STREAM_DOMAIN:?set STREAM_DOMAIN}
      # Optional TURN for peers behind strict NATs (the built-in relay covers
      # them too, at the cost of this server's bandwidth):
      # TURN_URL: turn:turn.example.com:3478
      # TURN_USERNAME: stream
      # TURN_CREDENTIAL: change-me
      # RELAY_ENABLED: "false"
      # MAX_RECEIVERS: "8"
      # Optional encrypted copies so links work after the sender leaves:
      # STORE_ENABLED: "true"
      # STORE_MAX_TRANSFER_MB: "2048"
      # STORE_MAX_TOTAL_MB: "10240"
      STORE_DIR: /data/store
      # Caddy runs on another container: trust the Docker network for client IPs.
      TRUST_PROXY: "true"
    volumes:
      - stream-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      STREAM_DOMAIN: ${STREAM_DOMAIN}
    command: caddy reverse-proxy --from ${STREAM_DOMAIN} --to stream:8787
    volumes:
      - caddy-data:/data

volumes:
  caddy-data:
  stream-data:
